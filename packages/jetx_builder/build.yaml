targets:
  $default:
    builders:
      jetx_builder|jetx_builder:
        enabled: true

builders:
  jetx_builder:
    import: "package:jetx_builder/builder.dart"
    builder_factories: ["jetxBuilder"]
    build_extensions: { ".dart": [".jetx_builder.g.part"] }
    auto_apply: dependents
    build_to: cache
    applies_builders: ["source_gen|combining_builder"]
