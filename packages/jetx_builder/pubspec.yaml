name: jetx_builder
description: build_runner code generator for JetX. Emits typed JetRouteData subclasses from @JetRoute-annotated classes.
version: 0.1.0-dev.1
homepage: https://github.com/fathialamre/jetx
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  analyzer: ">=6.0.0 <8.0.0"
  build: ^2.4.0
  glob: ^2.1.0
  source_gen: ^1.5.0
  jetx:
    path: ../..

dev_dependencies:
  build_runner: ^2.4.0
  build_test: ^2.2.0
  test: ^1.25.0
  lints: ^4.0.0
