name: jetx
description: JetX — fork of GetX. Open screens/snackbars/dialogs without context, manage states and inject dependencies.
version: 1.0.0-dev.1
homepage: https://github.com/fathialamre/jetx

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ">=1.0.0 <2.0.0"

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
